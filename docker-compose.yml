# Local PostgreSQL for RoutePulse (development and tests).
# Start: docker compose up -d   ·   Stop: docker compose down
# The API reads DATABASE_URL / TEST_DATABASE_URL from apps/api/.env (see apps/api/.env.example).
services:
  postgres:
    image: postgres:17
    container_name: routepulse-postgres
    environment:
      POSTGRES_USER: routepulse
      POSTGRES_PASSWORD: routepulse
      POSTGRES_DB: routepulse_dev
    ports:
      - "5432:5432"
    volumes:
      - routepulse-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routepulse -d routepulse_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  routepulse-pgdata:
