
services:
  api:
    image: routepulse-api:local
    container_name: routepulse-api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: development
      PORT: 4000
      DEMO_MODE: "true"
      LOG_LEVEL: info
      DATABASE_URL: postgresql://routepulse:routepulse@postgres:5432/routepulse_dev
    ports:
      - "127.0.0.1:4001:4000"
    networks:
      - default
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
  web:
    image: routepulse-web:local
    container_name: routepulse-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - default
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:8080/
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3


networks:
  default:
    name: lyb-hackathon_default
    external: true
