
name: RoutePulse CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: routepulse
          POSTGRES_PASSWORD: routepulse
          POSTGRES_DB: routepulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routepulse -d routepulse_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      DEMO_MODE: "true"
      PORT: 4000
      SESSION_SECRET: ci-only-session-secret-not-for-production-123456
      SEED_DEMO_PASSWORD: ci-only-demo-password
      DATABASE_URL: postgresql://routepulse:routepulse@localhost:5432/routepulse_dev
      TEST_DATABASE_URL: postgresql://routepulse:routepulse@localhost:5432/routepulse_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Typecheck and run tests
        run: npm test

      - name: Build frontend
        run: npm run build:web

      - name: Build API Docker image
        run: docker build -f apps/api/Dockerfile -t routepulse-api:ci .

      - name: Build frontend Docker image
        run: docker build -f apps/web/Dockerfile -t routepulse-web:ci .
